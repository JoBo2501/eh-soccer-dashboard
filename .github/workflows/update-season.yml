name: Update season data

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

concurrency:
  group: season-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install updater
        run: pip install -r requirements.txt
      - name: Test updater
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh official data
        id: refresh
        continue-on-error: true
        run: python scripts/update_data.py
      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season.json
          git commit -m "Update 2026 season data"
          git push
      - name: Report incomplete refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Some official results are still missing. Verified partial changes were preserved."
          exit 1
